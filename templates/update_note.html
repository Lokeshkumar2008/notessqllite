{% extends "base.html" %}

{% block title %}Update Note - Notes App{% endblock %}

{% block content %}
<style>
.update-note-wrapper {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Header Section */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.page-title {
    color: var(--text-main);
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 12px;
}

.title-icon {
    background: linear-gradient(135deg, var(--accent), var(--primary-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 2rem;
}

.btn-back {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.btn-back:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.1);
    transform: translateX(-3px);
}

/* Form Card */
.form-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
}

.form-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--primary-color));
}

/* Form Elements */
.form-group {
    margin-bottom: 25px;
}

.form-label {
    color: var(--text-main);
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 10px;
    display: block;
}

.form-control {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border-radius: 12px;
    padding: 16px;
    font-size: 1rem;
    transition: all 0.3s;
    width: 100%;
}

.form-control:focus {
    background: rgba(15, 23, 42, 0.9);
    border-color: var(--primary-color);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    color: var(--text-main);
    outline: none;
}

.form-control::placeholder {
    color: rgba(148, 163, 184, 0.4);
}

textarea.form-control {
    min-height: 250px;
    resize: vertical;
    line-height: 1.6;
}

/* Form Actions */
.form-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
    margin-top: 35px;
    padding-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.btn-cancel {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 10px;
    transition: all 0.3s;
}

.btn-cancel:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
}

.btn-submit {
    background: linear-gradient(135deg, var(--primary-color), #4f46e5);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    cursor: pointer;
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    background: linear-gradient(135deg, #4f46e5, var(--primary-color));
}

/* Mobile Responsive */
@media (max-width: 576px) {
    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
    
    .form-card {
        padding: 25px 20px;
        border-radius: 16px;
    }
    
    .form-actions {
        flex-direction: column;
        gap: 15px;
    }
    
    .btn-submit, .btn-cancel {
        width: 100%;
        text-align: center;
        justify-content: center;
    }
    
    .btn-cancel {
        background: rgba(255, 255, 255, 0.05);
        order: 2;
    }
    
    .btn-submit {
        order: 1;
    }
}
</style>

<div class="update-note-wrapper py-4">

    <div class="page-header">
        <h2 class="page-title">
            <i class="bi bi-pencil-square title-icon"></i>
            Edit Note
        </h2>
        <a href="/dashboard" class="btn-back">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="form-card">
        <form method="POST">
            
            <div class="form-group">
                <label class="form-label">Note Title</label>
                <input type="text" name="title" class="form-control" value="{{ note[1] }}" required placeholder="Enter note title..." autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-control" required placeholder="Write your note here...">{{ note[2] }}</textarea>
            </div>

            <div class="form-actions">
                <a href="/dashboard" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-submit">
                    <i class="bi bi-check2-circle"></i> Save Changes
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
