<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notes App{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(0,0,0,0.3);
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            background: rgba(0,0,0,0.4);
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* 🔥 Flash styling */
        .flash-container {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-4">
    <span class="navbar-brand">Notes Management</span>

    <div class="ms-auto">
        <a href="/dashboard" class="nav-link d-inline">Dashboard</a>
        <a href="/about" class="nav-link d-inline">About</a>
        <a href="/contact" class="nav-link d-inline">Contact</a>
        <a href="/logout" class="nav-link d-inline">Logout</a>
    </div>
</nav>

<!-- 🔥 FLASH MESSAGES (CENTER POPUP STYLE) -->
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<!-- CONTENT -->
<div class="content">
    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer>
    <p class="mb-0">© 2026 Notes Management System</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 AUTO HIDE FLASH -->
<script>
setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
    });
}, 3000);
</script>

</body>
</html>
