{% extends "base.html" %}

{% block title %}View Note - Notes App{% endblock %}

{% block content %}
<style>
.view-note-wrapper {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Header Section */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.page-title {
    color: var(--text-main);
    font-size: 1.8rem;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 12px;
}

.title-icon {
    background: linear-gradient(135deg, var(--primary-color), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 2rem;
}

.btn-back {
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.05);
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.btn-back:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.1);
    transform: translateX(-3px);
}

/* Note Card */
.note-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    overflow: hidden;
}

.note-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary-color), var(--accent));
}

/* Note Details */
.note-title {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 25px;
    line-height: 1.3;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.note-content {
    font-size: 1.1rem;
    color: var(--text-main);
    line-height: 1.8;
    white-space: pre-wrap;
    margin-bottom: 40px;
    min-height: 150px;
}

/* Actions */
.note-actions {
    display: flex;
    align-items: center;
    gap: 15px;
    padding-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.action-btn {
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.btn-edit {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.2);
}

.btn-edit:hover {
    background: var(--accent);
    color: var(--bg-color);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
}

.btn-delete {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.2);
}

.btn-delete:hover {
    background: #ef4444;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
}

/* Mobile Responsive */
@media (max-width: 576px) {
    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }
    
    .note-card {
        padding: 25px 20px;
        border-radius: 16px;
    }
    
    .note-title {
        font-size: 1.6rem;
    }

    .note-content {
        font-size: 1rem;
    }
    
    .note-actions {
        flex-direction: column;
    }
    
    .action-btn {
        width: 100%;
    }
}
</style>

<div class="view-note-wrapper py-4">

    <div class="page-header">
        <h2 class="page-title">
            <i class="bi bi-file-earmark-text title-icon"></i>
            Note Details
        </h2>
        <a href="javascript:history.back()" class="btn-back">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <div class="note-card">

        <h3 class="note-title">{{ note[1] }}</h3>
        
        <div class="note-content">{{ note[2] }}</div>

        <div class="note-actions">
            <a href="/updatenote/{{ note[0] }}" class="action-btn btn-edit">
                <i class="bi bi-pencil-square"></i> Edit Note
            </a>
            <a href="/deletenote/{{ note[0] }}" class="action-btn btn-delete">
                <i class="bi bi-trash3"></i> Delete Note
            </a>
        </div>

    </div>

</div>
{% endblock %}
