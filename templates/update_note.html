<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Note</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;

            /* ✅ ADD THESE 3 LINES */
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .form-container {
            max-width: 650px;
            margin: auto;
            margin-top: 60px;
        }

        .form-card {
            background: #fff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .form-title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
        }

        textarea {
            resize: none;
        }

        .btn-custom {
            background: #667eea;
            color: white;
            border-radius: 10px;
        }

        .btn-custom:hover {
            background: #5a67d8;
        }

        /* 🔥 Flash popup */
        .flash-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            z-index: 9999;
        }

        footer {
            background: #e5e7eb;
            text-align: center;
            padding: 10px;
        }
        /* FORM CONTAINER - FULL WIDTH CONTROL */
.form-container {
    width: 100%;
    max-width: 900px;   /* 🔥 increased width */
    margin: auto;
    margin-top: 60px;
    padding: 0 15px;    /* spacing for mobile */
    flex: 1;
}

/* FORM CARD - PROFESSIONAL LOOK */
.form-card {
    background: #ffffff;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

/* TITLE */
.form-title {
    text-align: center;
    font-weight: 600;
    margin-bottom: 25px;
    font-size: 22px;
}

/* INPUTS */
.form-control {
    border-radius: 8px;
    padding: 10px;
    font-size: 15px;
}

/* BUTTON */
.btn-custom {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 500;
}
    </style>
</head>

<body>

    <!-- Navbar -->
    <!-- Navbar -->
    <nav class="navbar px-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- LEFT -->
            <span class="navbar-brand">Update Note</span>

            <!-- RIGHT -->
            <div class="d-flex align-items-center gap-2">

                <!-- ✅ THREE DOTS (SMALL SCREEN ONLY) -->
                <div class="dropdown d-md-none">
                    <button class="btn btn-light" data-bs-toggle="dropdown">
                        ⋮
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/viewall">All Notes</a></li>
                        <li><a class="dropdown-item" href="/dashboard">Dashboard</a></li>
                        <li><a class="dropdown-item text-danger" href="/logout">Logout</a></li>
                    </ul>
                </div>

                <!-- ✅ BUTTONS (LARGE SCREEN ONLY) -->
                <div class="d-none d-md-flex gap-3">
                    <a href="/viewall" class="btn btn-light">All Notes</a>
                    <a href="/dashboard" class="btn btn-success">Dashboard</a>
                    <a href="/logout" class="btn btn-danger">Logout</a>
                </div>

            </div>

        </div>
    </nav>

    <!-- 🔥 FLASH MESSAGE -->
    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show shadow">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <!-- Form -->
    <div class="form-container">
        <div class="form-card">

            <h4 class="form-title">Edit Your Note</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" value="{{ note[1] }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Content</label>
                    <textarea name="content" class="form-control" rows="6" required>{{ note[2] }}</textarea>
                </div>

                <button type="submit" class="btn btn-custom w-100">Update Note</button>
            </form>

        </div>
    </div>
    <footer>
        © 2026 Notes Management System
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔥 AUTO HIDE -->
    <script>
        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(el => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 300);
            });
        }, 3000);
    </script>

</body>

</html>
