<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(6px);
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contact-card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .contact-title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            background: #667eea;
            color: #fff;
            border-radius: 10px;
        }

        .btn-custom:hover {
            background: #5a67d8;
        }

        footer {
            background: rgba(0,0,0,0.4);
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* Flash */
        .flash-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            z-index: 9999;
        }

        /* Mobile */
        @media (max-width: 576px) {
            .contact-card {
                padding: 20px;
            }

            .flash-container {
                width: 90%;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-md px-4">
    <div class="container-fluid">

        <span class="navbar-brand">Notes Management System</span>

        <!-- Toggle -->
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-md-auto text-start text-md-center gap-md-4">

                <li class="nav-item">
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a href="/logout" class="nav-link">Logout</a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<!-- Flash -->
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<!-- Contact Form -->
<div class="main-container">
    <div class="contact-card">

        <h4 class="contact-title">Contact</h4>

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="name" placeholder="Enter Name" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="email" name="email" placeholder="Enter Email" class="form-control" required>
            </div>

            <div class="mb-3">
                <textarea name="message" placeholder="Enter Message" class="form-control" rows="4" required></textarea>
            </div>

            <button class="btn btn-custom w-100">Submit</button>
        </form>

    </div>
</div>

<!-- Footer -->
<footer>
    <p class="mb-0">© 2026 Notes Management System</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Auto hide flash -->
<script>
setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
    });
}, 3000);
</script>

</body>
</html>
