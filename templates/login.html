<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            background: #667eea;
            color: #fff;
            border-radius: 10px;
        }

        footer {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            padding: 10px;
        }

        /* 🔥 Flash popup */
        .flash-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            z-index: 9999;
        }

        .navbar .ms-auto {
            display: flex;
            gap: 20px;
            /* adjust spacing */
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg px-4">
        <span class="navbar-brand">Notes Management System</span>

        <div class="ms-auto">
            <a href="/" class="nav-link d-inline">Home</a>
            <a href="/about" class="nav-link d-inline">About</a>
            <a href="/contact" class="nav-link d-inline">Contact</a>
        </div>
    </nav>

    <!-- 🔥 FLASH MESSAGE (POPUP STYLE) -->
    <div class="flash-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show shadow">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <!-- Login Section -->
    <div class="main-container">
        <div class="login-card">
            <h4 class="login-title">Login</h4>

            <form method="POST">
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-custom w-100">Login</button>
            </form>

            <div class="text-center mt-3">
                <a href="/forgot">Forgot Password?</a><br>
                <span>Don't have an account? <a href="/register">Register</a></span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p class="mb-0">© 2026 Notes Management System</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔥 AUTO HIDE -->
    <script>
        setTimeout(() => {
            document.querySelectorAll('.alert').forEach(el => {
                el.classList.remove('show');
                setTimeout(() => el.remove(), 300);
            });
        }, 3000);
    </script>

</body>

</html>
