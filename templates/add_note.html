<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Note</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
        }

        .form-container {
            max-width: 600px;
            width: 100%;
            margin: auto;
            margin-top: 30px;
        }

        .form-card {
            border-radius: 18px;
            background: #ffffff;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .form-title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        textarea {
            resize: none;
        }

        .btn-custom {
            background: #667eea;
            color: #fff;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-custom:hover {
            background: #5a67d8;
        }

        .bottom-space {
            height: 40px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-4">
    <span class="navbar-brand">Notes Management</span>

    <div class="ms-auto">
        <a href="/dashboard" class="btn btn-light me-2">Dashboard</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</nav>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container mt-3">
      {% for category, message in messages %}
        <div class="alert alert-{{category}} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<!-- Form Section -->
<div class="form-container">
    <div class="form-card">
        <h4 class="form-title">Create New Note</h4>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" placeholder="Enter note title" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-control" rows="6" placeholder="Write your note here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-custom w-100">Save Note</button>
        </form>
    </div>
</div>
    
<div class="bottom-space"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
