<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* NAVBAR */
.navbar {
    background: #e5e7eb;
    padding: 10px 20px;
}

.logo {
    width: 50px;
    border-radius: 50%;
}

.nav-title {
    font-size: 20px;
    font-weight: 600;
    margin-left: 10px;
}

.navbar a {
    color: rgb(11, 11, 151);
    text-decoration: none;
}

/* BACKGROUND */
.main-section {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

/* CARD */
.register-card {
    width: 360px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    text-align: center;
    color: white;
}

/* INPUT */
.form-control {
    border-radius: 10px;
    margin-bottom: 15px;
}

/* BUTTON */
.btn-register {
    background: linear-gradient(135deg, #00c6ff, #8e54e9);
    border: none;
    border-radius: 10px;
    padding: 10px;
    color: white;
    width: 100%;
}

/* FLASH */
.flash-box {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 350px;
    z-index: 9999;
}

/* FOOTER */
footer {
    background: #e5e7eb;
    text-align: center;
    padding: 10px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <img src="https://img.freepik.com/free-vector/vector-notebook-silhouette-design_779267-1820.jpg" class="logo">
        <div class="nav-title">NOTES MANAGEMENT SYSTEM</div>
    </div>

    <div>
        <a href="/" class="me-3">Home</a>
        <a href="/about" class="me-3">About</a>
        <a href="/contact">Contact</a>
    </div>
</nav>

<!-- 🔥 FLASH -->
<div class="flash-box">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, msg in messages %}
        <div class="alert alert-{{category}} alert-dismissible fade show shadow">
            {{ msg }}
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}
</div>

<!-- MAIN -->
<div class="main-section">
    <div class="register-card">

        <h3>Register</h3>

        <form action="/register" method="POST">
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>

            <button class="btn-register">Register</button>
        </form>

        <div class="mt-3">
            <a href="/" style="color:white;">Already registered? Login</a>
        </div>

    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2026 Notes Management System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- AUTO HIDE FLASH -->
<script>
setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
    });
}, 3000);
</script>

</body>
</html>
