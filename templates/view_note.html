<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Note</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .note-container {
            max-width: 700px;
            margin: auto;
            margin-top: 60px;
        }

        .note-card {
            background: #fff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .note-title {
            font-weight: 600;
            margin-bottom: 15px;
        }

        .note-content {
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .btn-group-custom {
            margin-top: 20px;
        }

        /* 🔥 Flash popup */
        .flash-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg px-4">
    <span class="navbar-brand">View Note</span>

    <div class="ms-auto">
        <a href="/viewall" class="btn btn-light me-2">All Notes</a>
        <a href="/dashboard" class="btn btn-success me-2">Dashboard</a>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
</nav>

<!-- 🔥 FLASH MESSAGE -->
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<!-- Note View -->
<div class="note-container">
    <div class="note-card">

        <h3 class="note-title">{{ note[1] }}</h3>

        <p class="note-content">{{ note[2] }}</p>

        <div class="btn-group-custom d-flex gap-2">
            <a href="/updatenote/{{ note[0] }}" class="btn btn-warning">Edit</a>
            <a href="/deletenote/{{ note[0] }}" class="btn btn-danger">Delete</a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 🔥 AUTO HIDE -->
<script>
setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
    });
}, 3000);
</script>

</body>
</html>
